<?xml version="1.0" encoding="UTF-8"?>
<!-- *** es_systems.cfg edited for Batocera by RGS TEAM ***-->
<systemList>
  <system>
        <fullname>Amstrad CPC v39</fullname>
        <name>amstradcpc_v39</name>
        <manufacturer>Amstrad</manufacturer>
        <release>1984</release>
        <hardware>computer</hardware>
        <path>/userdata/roms/amstradcpc_v39</path>
        <extension>.dsk .sna .tap .cdt .voc .m3u .zip .7z</extension>
        <command>emulatorlauncher %CONTROLLERSCONFIG% -system amstradcpc -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%</command>
        <platform>amstradcpcv39</platform>
        <theme>amstradcpcv39</theme>
        <emulators>
            <emulator name="libretro">
                <cores>
                    <core default="true">cap32</core>
                </cores>
            </emulator>
        </emulators>
  </system>
</systemList>

