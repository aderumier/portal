<!-- *** es_systems.cfg edited for Batocera by RGS TEAM ***-->
<systemList>
  <system>
      <fullname>Sharp MZ 2500</fullname>
      <name>mz2500</name>
      <manufacturer>Sharp</manufacturer>
      <release>1985</release>
      <hardware>vintage</hardware>
      <path>/userdata/roms/mz2500</path>
      <extension>.bin .7z .zip</extension>
      <command>emulatorlauncher %CONTROLLERSCONFIG% -system %SYSTEM% -emulator %EMULATOR% -core %CORE% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%</command>
      <platform>mz2500</platform>
      <theme>mz2500</theme>
      <emulators>
            <emulator name="libretro">
                <cores>
                    <core default="true">mame</core>
                </cores>
            </emulator>
        </emulators>
  </system>
</systemList>
