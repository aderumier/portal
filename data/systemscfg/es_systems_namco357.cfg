<?xml version="1.0"?>
<systemList>

  <system>
        <fullname>Namco System 357</fullname>
        <name>namco357</name>
        <manufacturer>Sony</manufacturer>
        <release>2006</release>
        <hardware>arcade</hardware>
        <path>/userdata/roms/namco357</path>
        <extension>.ps3 .psn .squashfs</extension>
        <command>emulatorlauncher %CONTROLLERSCONFIG% -system ps3 -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%</command>
        <platform>ps3</platform>
        <theme>namco357</theme>
        <emulators>
            <emulator name="rpcs3">
                <cores>
                    <core default="true">rpcs3</core>
                </cores>
            </emulator>
        </emulators>
  </system>

</systemList>
