<?xml version="1.0" encoding="UTF-8"?>
<!-- *** es_systems.cfg edited for Batocera by RGS TEAM ***-->
<systemList>^M
   <system>
      <fullname>Dreamneocd</fullname>
      <name>dreamneocd</name>
      <manufacturer>Sega</manufacturer>
      <release>1998</release>
      <hardware>console</hardware>
      <path>/userdata/roms/dreamneocd</path>
      <extension>.cdi .cue .gdi .chd .m3u</extension>
      <command>emulatorlauncher %CONTROLLERSCONFIG% -system dreamcast -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%</command>
      <emulators>
          <emulator name="flycast">
              <cores>
                  <core>flycast</core>
              </cores>
          </emulator>
          <emulator name="libretro">
              <cores>
                  <core default="true">flycast</core>
              </cores>
          </emulator>
          <emulator name="redream">
              <cores>
                  <core>redream</core>
              </cores>
          </emulator>
      </emulators>
   </system>
</systemList>^M

