name: Build Windows Executable

on:
  workflow_dispatch:
  push:
    tags:
      - 'windows-build-*'
    paths:
      - 'services/download_service/**'
  pull_request:
    paths:
      - 'services/download_service/**'

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install build dependencies
      working-directory: services/download_service
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Build executable
      working-directory: services/download_service
      run: |
        pyinstaller download_service.spec --clean --noconfirm
    
    - name: Create distribution package
      working-directory: services/download_service
      run: |
        New-Item -ItemType Directory -Force -Path dist\RGS_Download_Service | Out-Null
        Copy-Item dist\rgs_download_service.exe dist\RGS_Download_Service\
        "Your API token here" | Out-File -FilePath dist\RGS_Download_Service\API_TOKEN.txt -Encoding utf8
        
        if (Test-Path "install_windows_service.ps1") {
          Copy-Item install_windows_service.ps1 dist\RGS_Download_Service\
        }
        if (Test-Path "install_windows_service.bat") {
          Copy-Item install_windows_service.bat dist\RGS_Download_Service\
        }
        if (Test-Path "README_WINDOWS.md") {
          Copy-Item README_WINDOWS.md dist\RGS_Download_Service\README.txt
        } else {
          $readmeLines = @(
            "RGS Download Service - Windows Installation",
            "============================================",
            "",
            "1. Copy your API token to API_TOKEN.txt",
            "2. Edit config.ini if needed (optional)",
            "3. Run rgs_download_service.exe to test",
            "4. Use install_windows_service.ps1 or install_windows_service.bat to install as service",
            "",
            "Quick Start:",
            "------------",
            "- Run install_windows_service.ps1 (PowerShell) or install_windows_service.bat",
            "- Or manually use NSSM: https://nssm.cc/download",
            "",
            "Configuration:",
            "--------------",
            "Set environment variables via NSSM or create config.ini:",
            "- API_URL: Backend API URL (default: https://rgs-retro.ddns.net)",
            "- ROMS_PATH: Path to ROMs directory (default: C:\ProgramData\RGS\roms)",
            "- SERVICE_ID: Service identifier (default: hostname)",
            "- LOG_LEVEL: Logging level (default: INFO)"
          )
          $readmeLines -join "`r`n" | Out-File -FilePath dist\RGS_Download_Service\README.txt -Encoding utf8
        }
    
    - name: Create config template
      working-directory: services/download_service
      run: |
        $configLines = @(
          "[Service]",
          "API_URL=https://rgs-retro.ddns.net",
          "ROMS_PATH=C:\ProgramData\RGS\roms",
          "SERVICE_ID=windows-service-1",
          "LOG_LEVEL=INFO",
          "BANDWIDTH_UPDATE_INTERVAL=5"
        )
        $configLines -join "`r`n" | Out-File -FilePath dist\RGS_Download_Service\config.ini -Encoding utf8
    
    - name: Upload executable artifact
      uses: actions/upload-artifact@v3
      with:
        name: windows-executable
        path: services/download_service/dist/RGS_Download_Service/*
        retention-days: 30
    
    - name: Create release on tag
      if: startsWith(github.ref, 'refs/tags/windows-build-')
      uses: softprops/action-gh-release@v1
      with:
        files: services/download_service/dist/RGS_Download_Service/*
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
