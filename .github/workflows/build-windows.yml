name: Build Windows Executable

on:
  workflow_dispatch:
  push:
    tags:
      - 'windows-build-*'
    paths:
      - 'services/download_service/**'
  pull_request:
    paths:
      - 'services/download_service/**'

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install build dependencies
      working-directory: services/download_service
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Verify miniupnpc.dll is available
      working-directory: services/download_service
      run: |
        python -c "import miniupnpc; import os; from pathlib import Path; pkg_path = Path(miniupnpc.__file__).parent; dlls = list(pkg_path.glob('*.dll')); print(f'miniupnpc package path: {pkg_path}'); print(f'DLLs found: {[str(d) for d in dlls]}'); miniupnpc_dll = pkg_path / 'miniupnpc.dll'; assert miniupnpc_dll.exists(), f'miniupnpc.dll not found in {pkg_path}'; print(f'✓ miniupnpc.dll found: {miniupnpc_dll}')"
    
    - name: Build executable
      working-directory: services/download_service
      run: |
        pyinstaller download_service.spec --clean --noconfirm
    
    - name: Create distribution package
      working-directory: services/download_service
      run: |
        New-Item -ItemType Directory -Force -Path dist\RGS_Download_Service | Out-Null
        Copy-Item dist\rgs_download_service.exe dist\RGS_Download_Service\
        "Your API token here" | Out-File -FilePath dist\RGS_Download_Service\API_TOKEN.txt -Encoding utf8
        
        if (Test-Path "install_windows_service.ps1") {
          Copy-Item install_windows_service.ps1 dist\RGS_Download_Service\
        }
        if (Test-Path "install_windows_service.bat") {
          Copy-Item install_windows_service.bat dist\RGS_Download_Service\
        }
        if (Test-Path "README_WINDOWS.md") {
          Copy-Item README_WINDOWS.md dist\RGS_Download_Service\README.txt
        } else {
          $readmeText = "RGS Download Service - Windows Installation`r`n============================================`r`n`r`n1. Copy your API token to API_TOKEN.txt`r`n2. Edit config.ini if needed (optional)`r`n3. Run rgs_download_service.exe to test`r`n4. Use install_windows_service.ps1 or install_windows_service.bat to install as service`r`n`r`nQuick Start:`r`n------------`r`n- Run install_windows_service.ps1 (PowerShell) or install_windows_service.bat`r`n- Or manually use NSSM: https://nssm.cc/download`r`n`r`nConfiguration:`r`n--------------`r`nSet environment variables via NSSM or create config.ini:`r`n- API_URL: Backend API URL (default: https://rgs-retro.ddns.net)`r`n- ROMS_PATH: Path to ROMs directory (default: C:\ProgramData\RGS\roms)`r`n- SERVICE_ID: Service identifier (default: hostname)`r`n- LOG_LEVEL: Logging level (default: INFO)"
          $readmeText | Out-File -FilePath dist\RGS_Download_Service\README.txt -Encoding utf8
        }
    
    - name: Create config template
      working-directory: services/download_service
      run: |
        $configText = "[Service]`r`nAPI_URL=https://rgs-retro.ddns.net`r`nROMS_PATH=C:\ProgramData\RGS\roms`r`nSERVICE_ID=windows-service-1`r`nLOG_LEVEL=INFO`r`nLOG_DIR=C:\ProgramData\RGS\logs`r`nBANDWIDTH_UPDATE_INTERVAL=5`r`n# BANDWIDTH_LIMIT=12500000  # Optional: Client-side bandwidth limit in bytes/s (e.g., 12500000 = 100 Mbits/s). Never exceeds backend limit."
        $configText | Out-File -FilePath dist\RGS_Download_Service\config.ini -Encoding utf8
    
    - name: Upload executable artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-executable
        path: services/download_service/dist/RGS_Download_Service/*
        retention-days: 30
    
    - name: Create release on tag
      if: startsWith(github.ref, 'refs/tags/windows-build-')
      uses: softprops/action-gh-release@v1
      with:
        files: services/download_service/dist/RGS_Download_Service/*
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
