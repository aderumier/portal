# Front Reverse Proxy Configuration Example
# This is an example configuration for the front reverse proxy
# that sits in front of the backend nginx server.
# 
# Key requirements:
# 1. Pass through all cache-related headers from backend
# 2. Respect ETags and conditional requests
# 3. Don't override or strip cache headers
# 4. Use proxy_cache for /medias with ETag-based validation
#
# IMPORTANT SETUP REQUIREMENTS:
# ==============================
# 1. The proxy_cache_path directive MUST be added to your main nginx.conf file
#    (usually /etc/nginx/nginx.conf) in the http {} context, NOT in this server block.
#
# 2. Add this line to /etc/nginx/nginx.conf inside the http {} block:
#    proxy_cache_path /var/cache/nginx/medias levels=1:2 keys_zone=medias_cache:100m max_size=10g inactive=30d use_temp_path=off;
#
# 3. Create the cache directory with proper permissions:
#    sudo mkdir -p /var/cache/nginx/medias
#    sudo chown -R nginx:nginx /var/cache/nginx/medias  (or www-data:www-data on Debian/Ubuntu)
#    sudo chmod 755 /var/cache/nginx/medias
#
# 4. Test and reload nginx:
#    sudo nginx -t
#    sudo systemctl reload nginx

# Use "" for normal HTTP (enables keep-alive), "upgrade" only for WebSocket
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourdomain.com;  # Your public domain

    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    # Include recommended SSL configuration
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers (only add what's needed, don't override backend headers)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # IMPORTANT: BitTorrent tracker endpoints (/announce, /scrape)
    # merge_slashes must be off so nginx does not normalise %2F sequences in
    # the info_hash / peer_id query parameters.  Without this nginx either
    # returns 400 or silently mangles the binary-encoded query string, causing
    # the request to never reach the tracker.
    merge_slashes off;

    # Tracker announce and scrape — proxy to batocera-tracker (default :6969)
    location ~ ^/(announce|scrape) {
        proxy_pass http://127.0.0.1:6969;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        access_log off;

        # Do NOT buffer: tracker responses are tiny and must not be held
        proxy_buffering off;

        # Tight timeouts — tracker responses are near-instant
        proxy_connect_timeout 5s;
        proxy_send_timeout    5s;
        proxy_read_timeout    5s;
    }

    # Media files with proxy_cache - cache based on ETag
    # This location handles /medias/ requests with proxy caching
    location /medias/ {
        # Backend server (the one with batocera-games-catalog nginx config)
        proxy_pass https://backend-server-ip-or-domain:443;
        
        # Basic proxy headers
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Enable proxy caching
        # Cache key includes scheme, host, and URI to avoid conflicts
        proxy_cache medias_cache;
        proxy_cache_key "$scheme$proxy_host$request_uri";
        
        # Cache validation settings
        # Cache responses for 30 days, but validate using ETag
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 1h;
        proxy_cache_valid 301 302 1h;
        proxy_cache_valid any 5m;
        
        # Use stale cache while updating (serves stale content while fetching new)
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        
        # Lock cache while updating (prevents multiple requests from updating same entry)
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        
        # Add cache status header for debugging
        add_header X-Cache-Status $upstream_cache_status always;
        
        # IMPORTANT: Pass through all cache-related headers from backend
        # ETag is critical for cache validation
        proxy_pass_header ETag;
        proxy_pass_header Last-Modified;
        proxy_pass_header Cache-Control;
        proxy_pass_header Expires;
        proxy_pass_header Accept-Ranges;
        
        # Forward conditional requests (If-None-Match, If-Modified-Since)
        # This allows the proxy cache and browser to use cached content when unchanged
        proxy_set_header If-None-Match $http_if_none_match;
        proxy_set_header If-Modified-Since $http_if_modified_since;
        
        # Enable ETag support (nginx will generate ETag if backend doesn't provide one)
        etag on;
        
        # Don't buffer responses - stream them directly
        # This ensures headers (including ETag) are sent immediately
        proxy_buffering on;  # Keep buffering on for cache to work
        proxy_cache_background_update on;  # Update cache in background
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Cache revalidation (304 responses)
        # When client sends If-None-Match, backend may return 304 Not Modified
        # Cache these responses
        proxy_cache_revalidate on;
        
        # Cache method (only cache GET and HEAD)
        proxy_cache_methods GET HEAD;
    }

    # Proxy all other requests to backend server (without caching)
    location / {
        # Backend server (the one with batocera-games-catalog nginx config)
        proxy_pass https://backend-server-ip-or-domain:443;
        
        # Basic proxy headers
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # WebSocket support (Connection "" for normal HTTP, "upgrade" for WebSocket)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        # IMPORTANT: Pass through all cache-related headers from backend
        # Don't set or override Cache-Control, ETag, Expires, Last-Modified
        # These should come from the backend server
        
        # Pass through ETag header (critical for caching)
        proxy_pass_header ETag;
        
        # Pass through Last-Modified header
        proxy_pass_header Last-Modified;
        
        # Pass through Cache-Control header
        proxy_pass_header Cache-Control;
        
        # Pass through Expires header
        proxy_pass_header Expires;
        
        # Pass through Accept-Ranges header (for range requests)
        proxy_pass_header Accept-Ranges;
        
        # Forward conditional requests (If-None-Match, If-Modified-Since)
        # This allows the browser to use cached content when unchanged
        proxy_set_header If-None-Match $http_if_none_match;
        proxy_set_header If-Modified-Since $http_if_modified_since;
        
        # Don't buffer responses - stream them directly
        # This ensures headers are sent immediately
        proxy_buffering off;
        
        # Allow large uploads (video files up to 250MB)
        client_max_body_size 250m;

        # Timeouts (extended for large video uploads)
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}

# NOTE: The proxy_cache_path directive must be placed in the http {} context
# Add this to your main nginx.conf file (usually /etc/nginx/nginx.conf) in the http block:
#
# http {
#     # ... existing directives ...
#     
#     # Proxy cache for media files
#     proxy_cache_path /var/cache/nginx/medias 
#         levels=1:2 
#         keys_zone=medias_cache:100m 
#         max_size=10g 
#         inactive=30d 
#         use_temp_path=off;
#     
#     # Optional: Log cache operations
#     # log_format cache_log '$remote_addr - $remote_user [$time_local] "$request" '
#     #                      '$status $body_bytes_sent "$http_referer" '
#     #                      '"$http_user_agent" "$http_x_forwarded_for" '
#     #                      'cache_status=$upstream_cache_status '
#     #                      'etag=$sent_http_etag';
#     # access_log /var/log/nginx/cache-access.log cache_log;
#     
#     # ... rest of http block ...
# }
#
# After adding the proxy_cache_path, create the cache directory:
# sudo mkdir -p /var/cache/nginx/medias
# sudo chown -R nginx:nginx /var/cache/nginx/medias
# sudo chmod 755 /var/cache/nginx/medias
#
# Then reload nginx: sudo nginx -t && sudo systemctl reload nginx
