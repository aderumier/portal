# Front Reverse Proxy Configuration Example
# This is an example configuration for the front reverse proxy
# that sits in front of the backend nginx server.
# 
# Key requirements:
# 1. Pass through all cache-related headers from backend
# 2. Respect ETags and conditional requests
# 3. Don't override or strip cache headers

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourdomain.com;  # Your public domain

    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    
    # Include recommended SSL configuration
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers (only add what's needed, don't override backend headers)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Proxy all requests to backend server
    location / {
        # Backend server (the one with batocera-games-catalog nginx config)
        proxy_pass https://backend-server-ip-or-domain:443;
        
        # Basic proxy headers
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # IMPORTANT: Pass through all cache-related headers from backend
        # Don't set or override Cache-Control, ETag, Expires, Last-Modified
        # These should come from the backend server
        
        # Pass through ETag header (critical for caching)
        proxy_pass_header ETag;
        
        # Pass through Last-Modified header
        proxy_pass_header Last-Modified;
        
        # Pass through Cache-Control header
        proxy_pass_header Cache-Control;
        
        # Pass through Expires header
        proxy_pass_header Expires;
        
        # Pass through Accept-Ranges header (for range requests)
        proxy_pass_header Accept-Ranges;
        
        # Forward conditional requests (If-None-Match, If-Modified-Since)
        # This allows the browser to use cached content when unchanged
        proxy_set_header If-None-Match $http_if_none_match;
        proxy_set_header If-Modified-Since $http_if_modified_since;
        
        # Don't buffer responses - stream them directly
        # This ensures headers are sent immediately
        proxy_buffering off;
        
        # Don't add your own cache headers unless you want to override backend
        # Uncomment ONLY if you want the front proxy to cache responses itself:
        # proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=static_cache:10m max_size=1g inactive=60m use_temp_path=off;
        # proxy_cache static_cache;
        # proxy_cache_valid 200 30d;
        # proxy_cache_valid 404 1m;
        # add_header X-Cache-Status $upstream_cache_status;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Optional: If you want the front proxy to cache static assets itself
    # This can reduce load on backend, but you need to ensure cache invalidation
    # Uncomment and configure if needed:
    #
    # proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=static_cache:100m max_size=10g inactive=30d use_temp_path=off;
    #
    # location ~* ^/assets/.+\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
    #     proxy_pass https://backend-server-ip-or-domain:443;
    #     proxy_cache static_cache;
    #     proxy_cache_valid 200 30d;
    #     proxy_cache_key "$scheme$proxy_host$request_uri";
    #     proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    #     proxy_cache_lock on;
    #     add_header X-Cache-Status $upstream_cache_status;
    #     
    #     # Still pass through headers from backend
    #     proxy_pass_header ETag;
    #     proxy_pass_header Last-Modified;
    #     proxy_pass_header Cache-Control;
    #     proxy_set_header If-None-Match $http_if_none_match;
    #     proxy_set_header If-Modified-Since $http_if_modified_since;
    #     
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}

