# Proxy cache configuration for /medias endpoint
# This file should be included in your main nginx.conf file (in the http {} context)
# 
# To use this configuration:
# 1. Copy this file to /etc/nginx/conf.d/proxy-cache-medias.conf
# 2. Ensure your main nginx.conf includes files from conf.d:
#    include /etc/nginx/conf.d/*.conf;
# 3. Create the cache directory:
#    sudo mkdir -p /var/cache/nginx/medias
#    sudo chown -R nginx:nginx /var/cache/nginx/medias  (or www-data:www-data on Debian/Ubuntu)
#    sudo chmod 755 /var/cache/nginx/medias
# 4. Test and reload nginx:
#    sudo nginx -t && sudo systemctl reload nginx

# Proxy cache path for media files
# This directive MUST be in the http {} context
proxy_cache_path /var/cache/nginx/medias 
    levels=1:2 
    keys_zone=medias_cache:100m 
    max_size=10g 
    inactive=30d 
    use_temp_path=off;

